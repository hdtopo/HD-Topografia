<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - HD Topografia</title>
  <link rel="stylesheet" href="style.css"> 
</head>
<body>

  <header>
    <nav class="menu-container">
      <ul class="nav-menu">
        <li class="nav-item"><a href="index.html" class="nav-link">HD Topografia</a></li>
        <li class="nav-item"><a href="servicos.html" class="nav-link">Serviços</a></li>
        <li class="nav-item"><a href="locacao.html" class="nav-link">Locação Estação Total</a></li>
        <li class="nav-item"><a href="projetos.html" class="nav-link">Projetos</a></li>
        <li class="nav-item"><a href="videos.html" class="nav-link">Videos</a></li>
        <li class="nav-item"><a href="contato.html" class="nav-link active">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1 class="hero-title">Entre em Contato</h1>
    <p class="hero-subtitle">Solicite um Orçamento sem Compromisso</p>

    <div class="content-box" style="max-width: 600px; margin: 0 auto;">
      
      <!-- Mensagens de confirmação e erro -->
      <div id="msg-sucesso" style="display: none; color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; padding: 15px; border-radius: 6px; margin-bottom: 20px; font-weight: 600; text-align: center;">
        ✓ Mensagem enviada com sucesso! Entraremos em contato em breve.
      </div>
      
      <div id="msg-erro" style="display: none; color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; border-radius: 6px; margin-bottom: 20px; text-align: center;">
        ✕ Ocorreu um erro ao enviar sua mensagem. Por favor, tente novamente.
      </div>

      <!-- Formulário -->
      <form id="hd-contato-form">
        
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
        </div>
        
        <div class="form-group">
          <label for="email">E-mail de Contato</label>
          <input type="email" id="email" name="email" placeholder="seuemail@dominio.com" required>
        </div>

        <div class="form-group">
          <label for="telefone">Telefone / WhatsApp</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(31) 99999-9999" required>
        </div>

        <div class="form-group">
          <label for="mensagem">Mensagem / Detalhes do Serviço</label>
          <textarea id="mensagem" name="message" rows="5" placeholder="Descreva o serviço que você precisa... A mensagem sera enviada no e-mail da empresa e via whatsapp." required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="btn-enviar">Enviar Mensagem</button>
      </form>
    </div>
  </main>

  <!-- Script customizado para envio duplo (WhatsApp + Formspree) -->
  <script>
    document.getElementById('hd-contato-form').addEventListener('submit', async function(event) {
        event.preventDefault(); // Impede o recarregamento da página

        const form = event.target;
        const formData = new FormData(form);
        const btnSubmit = document.getElementById('btn-enviar');
        const divSucesso = document.getElementById('msg-sucesso');
        const divErro = document.getElementById('msg-erro');

        // Extrai os dados preenchidos
        const nome = formData.get('nome');
        const email = formData.get('email');
        const telefone = formData.get('telefone');
        const mensagem = formData.get('message');

        // Reseta as mensagens e altera o botão
        divSucesso.style.display = 'none';
        divErro.style.display = 'none';
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Processando...';

        // 1. Montar e abrir o WhatsApp imediatamente
        // COLOQUE SEU NÚMERO AQUI (Código do país 55 + DDD 31 + Número)
        const numeroWhatsApp = "5531987828593"; 
        
        const textoWhatsApp = `*Novo Pedido de Orçamento - HD Topografia*%0A%0A*Nome:* ${nome}%0A*E-mail:* ${email}%0A*Telefone:* ${telefone}%0A*Mensagem:* ${mensagem}`;
        const linkWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${textoWhatsApp}`;
        
        // Abre o WhatsApp em nova aba
        window.open(linkWhatsApp, '_blank');

        // 2. Enviar silenciosamente para o Formspree (seu endpoint mgaobykz)
        try {
            const response = await fetch('https://formspree.io/f/mgaobykz', {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (response.ok) {
                // Se o email foi enviado com sucesso
                form.reset();
                divSucesso.style.display = 'block';
            } else {
                // Se houve erro no Formspree
                divErro.style.display = 'block';
            }
        } catch (error) {
            console.error("Erro na requisição:", error);
            divErro.style.display = 'block';
        } finally {
            // Restaura o botão
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Enviar Mensagem';
        }
    });
  </script>

</body>
</html>
